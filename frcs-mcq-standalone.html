<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FRCS MCQ Prep</title>
<style>
:root {
  --bg: #0f1720;
  --surface: #182636;
  --surface-2: #1f3247;
  --accent: #35c4b5;
  --accent-dim: #1d5f59;
  --text: #e8eef4;
  --muted: #8ea3b5;
  --correct: #3fb96b;
  --wrong: #d9576b;
  --warn: #e8b64c;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  line-height: 1.45;
  min-height: 100vh;
}

#app { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 0 12px; border-bottom: 1px solid var(--surface-2);
  position: sticky; top: 0; background: var(--bg); z-index: 5;
}
.brand { display: flex; gap: 12px; align-items: center; }
.logo {
  width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
  color: #06231f; font-size: 22px; display: grid; place-items: center; font-weight: 800;
}
.topbar h1 { font-size: 1.1rem; }
.tagline { font-size: 0.75rem; color: var(--muted); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: var(--surface); color: var(--text); border: 1px solid var(--surface-2);
  border-radius: 10px; padding: 8px 12px; font-size: 1rem; cursor: pointer;
}
.badge {
  background: var(--accent); color: #06231f; border-radius: 999px;
  font-size: 0.7rem; padding: 1px 6px; margin-left: 2px; font-weight: 700;
}

.screen { padding-top: 18px; display: flex; flex-direction: column; gap: 18px; }
.hidden { display: none !important; }

.card {
  background: var(--surface); border: 1px solid var(--surface-2);
  border-radius: var(--radius); padding: 18px;
}

.hero h2 { font-size: 1.3rem; margin-bottom: 6px; }
.hero-stats { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.stat-pill {
  background: var(--surface-2); border-radius: 10px; padding: 10px 14px; flex: 1 1 0;
  min-width: 100px; text-align: center;
}
.stat-pill b { display: block; font-size: 1.2rem; color: var(--accent); }
.stat-pill small { color: var(--muted); font-size: 0.7rem; }

.section-title { font-size: 0.95rem; margin-bottom: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mode-card {
  background: var(--surface); border: 1px solid var(--surface-2); border-radius: var(--radius);
  padding: 16px 14px; text-align: left; color: var(--text); cursor: pointer;
  display: flex; flex-direction: column; gap: 4px; transition: transform .08s ease, border-color .15s;
}
.mode-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode-card strong { font-size: 1rem; }
.mode-card small { color: var(--muted); font-size: 0.75rem; }
.mode-icon { font-size: 1.4rem; margin-bottom: 4px; }

.topic-list { display: flex; flex-direction: column; gap: 8px; }
.topic-row {
  background: var(--surface); border: 1px solid var(--surface-2); border-radius: var(--radius);
  padding: 14px 16px; color: var(--text); cursor: pointer; text-align: left; width: 100%;
}
.topic-row:hover { border-color: var(--accent); }
.topic-row .t-head { display: flex; justify-content: space-between; font-size: 0.9rem; }
.topic-row .t-head span { color: var(--muted); font-size: 0.75rem; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

.quiz-hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hud-left, .hud-right { display: flex; gap: 8px; align-items: center; }
.chip {
  background: var(--surface-2); border: 1px solid var(--accent-dim); color: var(--text);
  border-radius: 999px; padding: 4px 10px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em;
}
.chip-topic { color: var(--accent); }
.progress-text { color: var(--muted); font-size: 0.85rem; }

.timer-wrap { background: var(--surface); border-radius: 999px; padding: 6px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--surface-2); }
.timer-bar { height: 6px; border-radius: 3px; background: var(--accent); width: 100%; transition: width 1s linear; }
.timer-bar.low { background: var(--wrong); }
.timer-text { font-variant-numeric: tabular-nums; color: var(--text); font-size: 0.85rem; min-width: 44px; text-align: right; }

.question-card { position: relative; }
.q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
#q-difficulty { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.flag-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; opacity: .35; }
.flag-btn.active { opacity: 1; }
.q-stem { font-size: 1.05rem; margin-bottom: 14px; }

.options { display: grid; gap: 8px; }
.option {
  display: flex; align-items: center; gap: 10px; background: var(--surface-2);
  border: 1px solid transparent; color: var(--text); border-radius: 10px;
  padding: 12px 14px; font-size: 0.95rem; cursor: pointer; text-align: left; width: 100%;
}
.option:hover:not(:disabled) { border-color: var(--accent-dim); }
.option .opt-key {
  width: 26px; height: 26px; border-radius: 50%; background: var(--surface);
  display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; color: var(--muted);
  flex: 0 0 auto;
}
.option.correct { background: rgba(63,185,107,.16); border-color: var(--correct); }
.option.correct .opt-key { background: var(--correct); color: #06130b; }
.option.wrong { background: rgba(217,87,107,.16); border-color: var(--wrong); }
.option.wrong .opt-key { background: var(--wrong); color: #fff; }
.option:disabled { cursor: default; }

.explanation {
  margin-top: 12px; background: var(--surface-2); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 12px 14px; font-size: 0.88rem; color: var(--text);
}
.explanation p { margin-top: 6px; color: var(--muted); }

.q-actions { display: flex; gap: 10px; margin-top: 14px; }
.q-actions.center { justify-content: center; }
.primary-btn {
  background: var(--accent); color: #06231f; border: none; border-radius: 10px;
  padding: 12px 18px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
}
.ghost-btn {
  background: none; color: var(--text); border: 1px solid var(--surface-2);
  border-radius: 10px; padding: 12px 18px; cursor: pointer;
}
.muted { color: var(--muted); font-size: 0.85rem; }

.score-card { text-align: center; }
.score-ring {
  --pct: 0; --size: 120px; --ring: var(--accent);
  width: var(--size); height: var(--size); border-radius: 50%; margin: 10px auto;
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem;
  background:
    radial-gradient(closest-side, var(--surface) 79%, transparent 80% 100%),
    conic-gradient(var(--ring) calc(var(--pct) * 1%), var(--surface-2) 0);
}
.result-stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.review-list { display: flex; flex-direction: column; gap: 8px; }
.review-row { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 0.9rem; }
.review-row .r-head { display: flex; gap: 8px; align-items: baseline; }
.review-row .verdict { font-weight: 700; font-size: 0.8rem; }
.review-row .verdict.ok { color: var(--correct); }
.review-row .verdict.bad { color: var(--wrong); }
.review-row .r-topic { margin-left: auto; color: var(--muted); font-size: 0.72rem; }
.review-row .r-why { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">✚</span>
      <div>
        <h1>FRCS MCQ Prep</h1>
        <p class="tagline">Surgical revision, bite-sized</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-bookmarks" class="icon-btn" title="Bookmarked questions" aria-label="Bookmarks">🔖 <span id="bm-count" class="badge">0</span></button>
    </div>
  </header>

  <main id="screen-home" class="screen">
    <section class="card hero">
      <h2>Welcome back</h2>
      <p id="home-summary">You haven't attempted any questions yet.</p>
      <div class="hero-stats" id="home-stats"></div>
    </section>

    <section>
      <h3 class="section-title">Study modes</h3>
      <div class="mode-grid">
        <button class="mode-card" id="btn-practice">
          <span class="mode-icon">📚</span>
          <strong>Practice set</strong>
          <small>10 questions · instant feedback &amp; explanations</small>
        </button>
        <button class="mode-card" id="btn-mock">
          <span class="mode-icon">⏱️</span>
          <strong>Timed mock</strong>
          <small>20 questions · 25-minute exam pace</small>
        </button>
        <button class="mode-card" id="btn-revision">
          <span class="mode-icon">🔖</span>
          <strong>Bookmarks</strong>
          <small>Review only the questions you flagged</small>
        </button>
      </div>
    </section>

    <section>
      <h3 class="section-title">Topics</h3>
      <div id="topic-list" class="topic-list"></div>
    </section>
  </main>

  <main id="screen-quiz" class="screen hidden">
    <div class="quiz-hud">
      <div class="hud-left">
        <span id="quiz-mode-label" class="chip"></span>
        <span id="quiz-topic" class="chip chip-topic"></span>
      </div>
      <div class="hud-right">
        <span id="quiz-progress" class="progress-text">1 / 10</span>
        <button id="btn-quit" class="icon-btn" title="End quiz">✕</button>
      </div>
    </div>

    <div id="timer-wrap" class="timer-wrap hidden">
      <div id="timer-bar" class="timer-bar"></div>
      <div class="timer-text"><span id="timer-clock">--:--</span></div>
    </div>

    <div class="card question-card">
      <div class="q-meta"><span id="q-difficulty"></span><button id="btn-flag" class="flag-btn" title="Bookmark">🔖</button></div>
      <h2 id="q-stem" class="q-stem"></h2>
      <div id="options" class="options"></div>
      <div id="explanation" class="explanation hidden">
        <strong>💡 Explanation</strong>
        <p id="explanation-text"></p>
      </div>
      <div class="q-actions">
        <button id="btn-next" class="primary-btn hidden">Next question →</button>
      </div>
    </div>
  </main>

  <main id="screen-results" class="screen hidden">
    <section class="card score-card">
      <h2 id="result-title">Quiz complete</h2>
      <div class="score-ring" id="score-ring"></div>
      <p id="result-detail" class="muted"></p>
      <div class="result-stats" id="result-stats"></div>
    </section>
    <section class="card">
      <h3 class="section-title">Review answers</h3>
      <div id="review-list" class="review-list"></div>
    </section>
    <div class="q-actions center">
      <button id="btn-retake" class="primary-btn">Retake</button>
      <button id="btn-home" class="ghost-btn">Home</button>
    </div>
  </main>

  <main id="screen-bookmarks" class="screen hidden">
    <h3 class="section-title">Bookmarked questions</h3>
    <div id="bookmark-list" class="topic-list"></div>
    <button id="btn-bm-home" class="ghost-btn">← Back home</button>
  </main>
</div>

<script>
/**
 * Seed question bank — original FRCS-style single-best-answer questions.
 * Schema: { id, topic, difficulty, stem, options[4], answer (index), explanation }
 * Replace or extend this array (or load from a JSON endpoint) with your own bank.
 */
const QUESTION_BANK = [
  // ---------- General Surgery ----------
  {
    id: "gs-1", topic: "General Surgery", difficulty: "Core",
    stem: "A 54-year-old man presents with colicky abdominal pain, vomiting and distension 3 weeks after an open cholecystectomy. AXR shows dilated small bowel. What is the most likely cause?",
    options: ["Adhesions", "Incarcerated hernia", "Crohn's stricture", "Gallstone ileus"],
    answer: 0,
    explanation: "Adhesions are the commonest cause of small bowel obstruction in adults with previous abdominal surgery. Always exclude hernia and consider malignancy/Crohn's in patients without prior surgery."
  },
  {
    id: "gs-2", topic: "General Surgery", difficulty: "Core",
    stem: "Which structure is compressed during the Pringle manoeuvre?",
    options: ["Coeliac axis", "Hepatoduodenal ligament contents", "Splenic artery", "Inferior vena cava"],
    answer: 1,
    explanation: "The Pringle manoeuvre compresses the portal triad (hepatic artery, portal vein, bile duct) within the free edge of the lesser omentum to control hepatic inflow bleeding."
  },
  {
    id: "gs-3", topic: "General Surgery", difficulty: "Core",
    stem: "Charcot's triad (RUQ pain, fever, jaundice) is classically seen in which condition?",
    options: ["Acute cholecystitis", "Ascending cholangitis", "Acute pancreatitis", "Obstructing gallstone ileus"],
    answer: 1,
    explanation: "Charcot's triad indicates ascending cholangitis (often from choledocholithiasis). Add hypotension and confusion → Reynolds' pentad; treat urgently with antibiotics and biliary drainage."
  },
  {
    id: "gs-4", topic: "General Surgery", difficulty: "Core",
    stem: "A direct inguinal hernia protrudes in relation to the inferior epigastric vessels in which direction?",
    options: ["Lateral", "Medial", "Superior", "Posterior"],
    answer: 1,
    explanation: "Direct hernias push through the posterior wall of the inguinal canal medial to the inferior epigastric vessels; indirect hernias enter the deep ring lateral to them."
  },
  {
    id: "gs-5", topic: "General Surgery", difficulty: "Core",
    stem: "Which hernia is most common in women and carries the highest risk of strangulation?",
    options: ["Indirect inguinal", "Direct inguinal", "Femoral", "Umbilical"],
    answer: 2,
    explanation: "Femoral hernias are more common in women and have a narrow, rigid neck → high risk of incarceration and strangulation; repair promptly."
  },
  {
    id: "gs-6", topic: "General Surgery", difficulty: "Advanced",
    stem: "Visceral pain from an inflamed appendix is initially felt periumbilically. Which spinal segment carries this afferent pain?",
    options: ["T6", "T8", "T10", "T12"],
    answer: 2,
    explanation: "The appendix is a midgut derivative; visceral afferents enter at T10, producing referred periumbilical pain before inflammation reaches the parietal peritoneum (RIF somatic pain)."
  },
  {
    id: "gs-7", topic: "General Surgery", difficulty: "Advanced",
    stem: "In TNM staging for colorectal cancer, a tumour invading through the muscularis propria into the perirectal tissues, with no nodal disease, is which stage group?",
    options: ["Stage I", "Stage IIA", "Stage IIB", "Stage III"],
    answer: 1,
    explanation: "T3N0M0 corresponds to Stage IIA. T1–T2N0M0 is Stage I, T4N0M0 is Stage IIB/IIC depending on detail, and any N+ without metastasis is Stage III."
  },

  // ---------- Orthopaedics ----------
  {
    id: "or-1", topic: "Orthopaedics", difficulty: "Core",
    stem: "A Colles' fracture is a distal radius fracture with which displacement?",
    options: ["Volar displacement of the distal fragment", "Dorsal displacement of the distal fragment", "Lateral displacement only", "Impacted, non-displaced"],
    answer: 1,
    explanation: "Colles' = extra-articular distal radius fracture with dorsal angulation/displacement producing the 'dinner fork' deformity; usually FOOSH. Volar displacement = Smith's fracture."
  },
  {
    id: "or-2", topic: "Orthopaedics", difficulty: "Core",
    stem: "A 78-year-old woman sustains a displaced intracapsular femoral neck fracture after a fall. What is the definitive treatment of choice?",
    options: ["Dynamic hip screw", "Cannulated screws", "Hemiarthroplasty", "Conservative traction"],
    answer: 2,
    explanation: "In an older patient with a displaced intracapsular fracture, the disrupted blood supply (medial circumflex) makes AVN/non-union likely — arthroplasty is preferred. Cannulated screws for nondisplaced; DHS for extracapsular."
  },
  {
    id: "or-3", topic: "Orthopaedics", difficulty: "Core",
    stem: "A 24-year-old rugby player dislocates his shoulder. What is the commonest direction and the typical associated labral injury?",
    options: ["Posterior dislocation; reverse Bankart", "Anterior dislocation; anteroinferior labral (Bankart) lesion", "Inferior dislocation; SLAP lesion", "Anterior dislocation; rotator cuff tear only"],
    answer: 1,
    explanation: "Anterior dislocation accounts for ~95% of cases; the Bankart lesion is an anteroinferior glenoid labral tear. Axillary nerve injury is common and must be documented."
  },
  {
    id: "or-4", topic: "Orthopaedics", difficulty: "Advanced",
    stem: "Which finding is the earliest and most reliable sign of acute compartment syndrome?",
    options: ["Pulselessness", "Pain out of proportion / on passive stretch", "Pallor of the limb", "Complete sensory loss"],
    answer: 1,
    explanation: "Pain out of proportion and pain on passive stretch of involved muscles are the earliest signs; the other 'Ps' are late signs of irreversible ischaemia. Diagnosis is clinical; measure compartment pressure if unclear (ΔP < 30 mmHg relative to diastolic)."
  },
  {
    id: "or-5", topic: "Orthopaedics", difficulty: "Core",
    stem: "A fall on an outstretched hand causes snuffbox tenderness but normal initial radiographs. What is the most appropriate management?",
    options: ["Discharge with analgesia", "Treat as scaphoid fracture and immobilise, repeat imaging in 10–14 days", "Immediate ORIF", "CT only if pain persists at 6 weeks"],
    answer: 1,
    explanation: "Scaphoid fractures are often radiographically occult at presentation. Immobilise (thumb spica) and repeat X-ray/MRI at 10–14 days; missed fractures risk proximal pole AVN and non-union."
  },

  // ---------- Trauma & Critical Care ----------
  {
    id: "tc-1", topic: "Trauma & Critical Care", difficulty: "Core",
    stem: "During ATLS primary survey, a patient with suspected tension pneumothorax should be treated with immediate needle decompression at which site?",
    options: ["2nd intercostal space, mid-clavicular line", "5th intercostal space, mid-axillary line (or 2nd ICS MCL per protocol)", "4th intercostal space, mid-clavicular line", "Below the 12th rib posteriorly"],
    answer: 1,
    explanation: "Needle decompression is performed immediately without awaiting CXR; site varies by protocol (4th/5th ICS AAL per ATLS 10th ed, or 2nd ICS MCL historically). Definitive treatment is chest drain + senior help."
  },
  {
    id: "tc-2", topic: "Trauma & Critical Care", difficulty: "Core",
    stem: "Massive transfusion protocol typically uses which ratio of packed red cells : FFP : platelets?",
    options: ["1:1:1", "2:1:1", "4:1:1", "1:2:4"],
    answer: 0,
    explanation: "A 1:1:1 protocol approximates whole blood and reduces dilutional coagulopathy; give TXA early (within 3 h) and correct hypocalcaemia and hypothermia."
  },
  {
    id: "tc-3", topic: "Trauma & Critical Care", difficulty: "Advanced",
    stem: "Beck's triad of cardiac tamponade consists of hypotension, raised JVP and which third feature?",
    options: ["Muffled heart sounds", "Pulsus paradoxus only", "Widened pulse pressure", "Kussmaul's sign"],
    answer: 0,
    explanation: "Beck's triad: hypotension, elevated JVP, muffled heart sounds. Pulsus paradoxus supports the diagnosis; definitive management is pericardiocentesis/surgical drainage."
  },

  // ---------- Vascular ----------
  {
    id: "va-1", topic: "Vascular", difficulty: "Core",
    stem: "What is the usual diameter threshold for elective repair of an asymptomatic abdominal aortic aneurysm in a man?",
    options: ["3.0 cm", "4.0 cm", "5.5 cm", "7.0 cm"],
    answer: 2,
    explanation: "5.5 cm in men (≈5.0 cm in women) is the conventional elective repair threshold; below this, ultrasound surveillance with cardiovascular risk factor modification."
  },
  {
    id: "va-2", topic: "Vascular", difficulty: "Core",
    stem: "The '6 Ps' of acute limb ischaemia include pain, pallor, pulselessness, paraesthesia, paralysis and which one?",
    options: ["Pruritus", "Perishingly cold (poikilothermia)", "Pitting oedema", "Pulsatile mass"],
    answer: 1,
    explanation: "The 6 Ps: pain, pallor, pulselessness, paraesthesia, paralysis, perishingly cold. Sensation/motor loss indicate irreversible ischaemia risk — revascularise urgently (embolectomy ± imaging first)."
  },

  // ---------- Urology ----------
  {
    id: "ur-1", topic: "Urology", difficulty: "Core",
    stem: "First-line analgesia for acute renal colic is:",
    options: ["IV opioids", "NSAIDs (e.g. diclofenac)", "Paracetamol alone", "Antispasmodics"],
    answer: 1,
    explanation: "NSAIDs are first line — they reduce ureteric spasm and prostaglandin-mediated pain; opioids are second line. Assess for infection/obstruction (sepsis → urgent decompression)."
  },
  {
    id: "ur-2", topic: "Urology", difficulty: "Core",
    stem: "The commonest organism causing uncomplicated urinary tract infection is:",
    options: ["Klebsiella pneumoniae", "Proteus mirabilis", "Escherichia coli", "Enterococcus faecalis"],
    answer: 2,
    explanation: "E. coli accounts for ~80–85% of uncomplicated UTIs. Proteus suggests stones (urease, struvite); Enterococcus is commoner in catheter-associated/HCU infection."
  },
  {
    id: "ur-3", topic: "Urology", difficulty: "Advanced",
    stem: "TUR syndrome after transurethral prostate resection is caused mainly by:",
    options: ["Hyperkalaemia from blood transfusion", "Dilutional hyponatraemia from irrigation fluid absorption", "Sepsis from infected urine", "CO2 embolism"],
    answer: 1,
    explanation: "Absorption of hypotonic irrigation fluid causes dilutional hyponatraemia with confusion, hypertension, bradycardia and visual disturbances. Use isotonic irrigation where possible; monitor procedure time."
  },

  // ---------- Cardiothoracic ----------
  {
    id: "ct-1", topic: "Cardiothoracic", difficulty: "Core",
    stem: "Which conduit has the best long-term patency for CABG when grafted to the LAD?",
    options: ["Great saphenous vein", "Left internal mammary artery", "Radial artery", "Synthetic graft"],
    answer: 1,
    explanation: "LIMA-to-LAD gives superior long-term patency and survival. Radial artery is a good second arterial conduit; vein grafts are more prone to intimal hyperplasia/atherosclerosis."
  },

  // ---------- Neurosurgery ----------
  {
    id: "ns-1", topic: "Neurosurgery", difficulty: "Core",
    stem: "A 22-year-old man has a lucid interval after a head injury, then rapid deterioration. The classic causative vessel is the:",
    options: ["Bridging veins", "Middle meningeal artery", "Anterior cerebral artery", "Basilar artery"],
    answer: 1,
    explanation: "Epidural haematoma classically follows temporal bone fracture with middle meningeal artery bleeding and a lucid interval. Bridging vein rupture causes subdural haematoma."
  },
  {
    id: "ns-2", topic: "Neurosurgery", difficulty: "Advanced",
    stem: "Cushing's triad of raised intracranial pressure comprises hypertension, bradycardia and:",
    options: ["Hyperthermia", "Irregular respiration", "Pupillary constriction", "Hypoglycaemia"],
    answer: 1,
    explanation: "Cushing's reflex: hypertension with bradycardia and irregular breathing (Cheyne–Stokes) due to brainstem ischaemia — a pre-terminal sign requiring urgent ICP control."
  },

  // ---------- Upper GI / HPB ----------
  {
    id: "ug-1", topic: "Upper GI & HPB", difficulty: "Core",
    stem: "A patient with acute pancreatitis has periumbilical bruising. This sign is called:",
    options: ["Grey Turner's sign", "Cullen's sign", "Kehr's sign", "Murphy's sign"],
    answer: 1,
    explanation: "Cullen's sign = periumbilical bruising; Grey Turner's = flank bruising — both suggest retroperitoneal haemorrhage in necrotising pancreatitis. Murphy's sign is cholecystitis; Kehr's is referred shoulder pain (splenic injury)."
  },
  {
    id: "ug-2", topic: "Upper GI & HPB", difficulty: "Advanced",
    stem: "Which procedure is standard for a resectable adenocarcinoma of the pancreatic head?",
    options: ["Distal pancreatectomy", "Pancreaticoduodenectomy (Whipple)", "Total pancreatectomy", "Palliative bypass only"],
    answer: 1,
    explanation: "The Whipple procedure (pancreaticoduodenectomy) resects the pancreatic head, duodenum, gallbladder and distal CBD with reconstruction. Distal lesions → distal pancreatectomy ± splenectomy."
  }
];

</script>
<script>
/* FRCS MCQ Prep — single-page app logic. State persisted in localStorage. */
(() => {
  "use strict";

  const LS_PROGRESS = "frcs.progress";   // { questionId: { correct: bool, attempts: n } }
  const LS_BOOKMARKS = "frcs.bookmarks"; // [questionId]
  const LS_BEST = "frcs.best";           // { mock: bestScorePct, practice: bestScorePct }

  // ---------- state ----------
  const store = {
    get(k, fallback) {
      try { return JSON.parse(localStorage.getItem(k)) ?? fallback; }
      catch { return fallback; }
    },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let progress = store.get(LS_PROGRESS, {});
  let bookmarks = new Set(store.get(LS_BOOKMARKS, []));
  let best = store.get(LS_BEST, {});

  let quiz = null; // { mode, items:[q], index, answers:{id:idx}, timerId, secondsLeft, totalSeconds }

  const $ = (id) => document.getElementById(id);
  const screens = {
    home: $("screen-home"),
    quiz: $("screen-quiz"),
    results: $("screen-results"),
    bookmarks: $("screen-bookmarks"),
  };

  function show(name) {
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle("hidden", k !== name));
  }

  // ---------- helpers ----------
  const topicCounts = () => {
    const map = {};
    QUESTION_BANK.forEach((q) => { map[q.topic] = (map[q.topic] || 0) + 1; });
    return map;
  };

  function pickQuestions(mode, filter) {
    let pool = QUESTION_BANK;
    if (filter) pool = pool.filter((q) => q.topic === filter);
    if (mode === "bookmarks") pool = pool.filter((q) => bookmarks.has(q.id));
    pool = [...pool].sort(() => Math.random() - 0.5);
    const size = mode === "mock" ? Math.min(20, pool.length)
               : mode === "bookmarks" ? pool.length
               : Math.min(10, pool.length);
    return pool.slice(0, size);
  }

  function recordResult(qId, correct) {
    const p = progress[qId] || { correct: 0, attempts: 0 };
    p.attempts += 1;
    if (correct) p.correct += 1;
    progress[qId] = p;
    store.set(LS_PROGRESS, progress);
  }

  function setBookmark(id, on) {
    if (on) bookmarks.add(id); else bookmarks.delete(id);
    store.set(LS_BOOKMARKS, [...bookmarks]);
    updateBookmarkCount();
    renderFlagButton();
  }
  function updateBookmarkCount() { $("bm-count").textContent = bookmarks.size; }
  function renderFlagButton() {
    if (!quiz) return;
    const q = quiz.items[quiz.index];
    $("btn-flag").classList.toggle("active", bookmarks.has(q.id));
  }

  const fmtTime = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  // ---------- home ----------
  function renderHome() {
    const ids = Object.keys(progress);
    const attempted = ids.length;
    const total = QUESTION_BANK.length;
    const correctCount = ids.reduce((n, id) => n + (progress[id].correct > 0 ? 1 : 0), 0);
    const avg = attempted ? Math.round((correctCount / attempted) * 100) : 0;

    $("home-summary").textContent = attempted
      ? `You've attempted ${attempted} of ${total} questions. Keep going!`
      : `You haven't attempted any questions yet.`;

    $("home-stats").innerHTML = `
      <div class="stat-pill"><b>${attempted}/${total}</b><small>Attempted</small></div>
      <div class="stat-pill"><b>${avg}%</b><small>First-try accuracy</small></div>
      <div class="stat-pill"><b>${bookmarks.size}</b><small>Bookmarks</small></div>
      <div class="stat-pill"><b>${best.mock ?? "—"}%</b><small>Best mock</small></div>`;

    const counts = topicCounts();
    $("topic-list").innerHTML = Object.entries(counts).map(([topic, n]) => {
      const t = QUESTION_BANK.filter((q) => q.topic === topic);
      const done = t.filter((q) => progress[q.id]).length;
      const pct = Math.round((done / t.length) * 100);
      return `<button class="topic-row" data-topic="${topic}">
        <div class="t-head"><strong>${topic}</strong><span>${done}/${t.length} correct · ${n} questions</span></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
      </button>`;
    }).join("");

    document.querySelectorAll(".topic-row").forEach((b) =>
      b.addEventListener("click", () => startQuiz("practice", b.dataset.topic)));
  }

  // ---------- quiz ----------
  function startQuiz(mode, topic = null) {
    const items = pickQuestions(mode, topic);
    if (!items.length) {
      alert("No questions available for this selection yet.");
      return;
    }
    quiz = {
      mode, topic, items, index: 0,
      answers: {},
      totalSeconds: mode === "mock" ? 25 * 60 : null,
      secondsLeft: mode === "mock" ? 25 * 60 : null,
      timerId: null,
    };
    if (mode === "mock") {
      $("timer-wrap").classList.remove("hidden");
      tickTimer();
      quiz.timerId = setInterval(tickTimer, 1000);
    } else {
      $("timer-wrap").classList.add("hidden");
    }
    $("quiz-mode-label").textContent = mode === "mock" ? "Timed mock" : "Practice";
    $("btn-next").textContent = "Next question →";
    renderQuestion();
    show("quiz");
  }

  function tickTimer() {
    if (!quiz || quiz.secondsLeft == null) return;
    quiz.secondsLeft = Math.max(0, quiz.secondsLeft - 1);
    const pct = (quiz.secondsLeft / quiz.totalSeconds) * 100;
    $("timer-bar").style.width = pct + "%";
    $("timer-bar").classList.toggle("low", quiz.secondsLeft <= 60);
    $("timer-clock").textContent = fmtTime(quiz.secondsLeft);
    if (quiz.secondsLeft <= 0) finishQuiz(true);
  }

  function renderQuestion() {
    const q = quiz.items[quiz.index];
    $("q-difficulty").textContent = `${q.difficulty} · ${q.topic}`;
    $("q-stem").textContent = q.stem;
    $("quiz-progress").textContent = `${quiz.index + 1} / ${quiz.items.length}`;
    $("quiz-topic").textContent = q.topic;
    $("explanation").classList.add("hidden");
    $("btn-next").classList.add("hidden");
    renderFlagButton();

    $("options").innerHTML = q.options.map((opt, i) =>
      `<button class="option" data-i="${i}"><span class="opt-key">${"ABCD"[i]}</span><span>${opt}</span></button>`
    ).join("");

    document.querySelectorAll(".option").forEach((btn) =>
      btn.addEventListener("click", () => answerQuestion(Number(btn.dataset.i))));
  }

  function answerQuestion(i) {
    const q = quiz.items[quiz.index];
    if (quiz.mode === "mock") quiz.answers[q.id] = i; // no immediate feedback in mock
    else {
      const correct = i === q.answer;
      quiz.answers[q.id] = i;
      recordResult(q.id, correct);
      revealAnswer(i, correct);
      if (quiz.index === quiz.items.length - 1) $("btn-next").textContent = "Finish quiz ✓";
      $("btn-next").classList.remove("hidden");
    }
    if (quiz.mode === "mock" && quiz.index === quiz.items.length - 1) {
      $("btn-next").textContent = "Finish exam ✓";
    }
    if (quiz.mode === "mock") $("btn-next").classList.remove("hidden");
    document.querySelectorAll(".option").forEach((b) => { b.disabled = true; });
  }

  function revealAnswer(chosen, correct) {
    const q = quiz.items[quiz.index];
    document.querySelectorAll(".option").forEach((btn, idx) => {
      if (idx === q.answer) btn.classList.add("correct");
      if (idx === chosen && !correct) btn.classList.add("wrong");
    });
    $("explanation-text").textContent = q.explanation;
    $("explanation").classList.remove("hidden");
  }

  function nextQuestion() {
    if (quiz.index < quiz.items.length - 1) {
      quiz.index += 1;
      renderQuestion();
    } else {
      finishQuiz(false);
    }
  }

  function finishQuiz(timedOut) {
    if (!quiz) return;
    clearInterval(quiz.timerId);
    captureResults();
    const mode = quiz.mode;

    // In mock mode, grade everything at the end.
    if (mode === "mock") {
      quiz.items.forEach((q) => {
        const chosen = quiz.answers[q.id];
        if (chosen === undefined) return; // unanswered counts as wrong
        recordResult(q.id, chosen === q.answer);
      });
    }

    const answered = quiz.items.filter((q) => quiz.answers[q.id] !== undefined);
    const correct = answered.filter((q) => quiz.answers[q.id] === q.answer).length;
    const pct = quiz.items.length ? Math.round((correct / quiz.items.length) * 100) : 0;

    if (mode === "mock" && !best.mock) best.mock = 0;
    if (mode === "mock") {
      best.mock = Math.max(best.mock || 0, pct);
      store.set(LS_BEST, best);
    }
    renderResults(mode, correct, pct, timedOut);
    quiz = null;
    show("results");
  }

  // ---------- results ----------
  function renderResults(mode, correct, pct, timedOut) {
    const resultsTotal = lastQuizItems.length;
    const ring = $("score-ring");
    ring.style.setProperty("--pct", pct);
    ring.style.setProperty("--ring", pct >= 70 ? "var(--correct)" : pct >= 40 ? "var(--warn)" : "var(--wrong)");
    ring.innerHTML = `<div>${pct}%</div>`;
    $("result-title").textContent = timedOut ? "Time's up!" : (pct >= 70 ? "Great work 🎉" : pct >= 40 ? "Quiz complete" : "Keep practising 💪");
    $("result-detail").textContent =
      `${correct} / ${resultsTotal} correct` +
      (mode === "mock" ? ` · Best mock score: ${best.mock ?? pct}%` : "") +
      (timedOut ? " (time expired)" : "");

    // Per-topic breakdown from just-completed answers is unavailable once quiz=null,
    // so we keep the review list from the last graded items captured before nulling.
    $("result-stats").innerHTML = lastQuizTopics
      .map(([t, c, n]) => `<div class="stat-pill"><b>${c}/${n}</b><small>${t}</small></div>`)
      .join("");

    $("review-list").innerHTML = lastQuizItems.map((q) => {
      const chosen = lastQuizAnswers[q.id];
      const ok = chosen === q.answer;
      const verdictText = chosen === undefined ? "Unanswered" : ok ? "✓ Correct" : "✗ Incorrect";
      return `<div class="review-row">
        <div class="r-head">
          <span class="verdict ${ok ? "ok" : "bad"}">${verdictText}</span>
          <span>${q.stem}</span>
          <span class="r-topic">${q.topic}</span>
        </div>
        <div class="r-why">${q.explanation}</div>
      </div>`;
    }).join("");
    lastQuizItems = null;
  }

  let lastQuizItems = [];
  let lastQuizAnswers = {};
  let lastQuizTopics = [];

  // Capture state at finish time (called from finishQuiz before quiz=null).
  function captureResults() {
    lastQuizItems = quiz.items;
    lastQuizAnswers = quiz.answers;
    const tmap = {};
    quiz.items.forEach((q) => {
      const t = tmap[q.topic] || { c: 0, n: 0 };
      t.n += 1;
      if (quiz.answers[q.id] === q.answer) t.c += 1;
      tmap[q.topic] = t;
    });
    lastQuizTopics = Object.entries(tmap);
  }

  // ---------- bookmarks ----------
  function renderBookmarks() {
    const list = [...bookmarks]
      .map((id) => QUESTION_BANK.find((q) => q.id === id))
      .filter(Boolean);
    $("bookmark-list").innerHTML = list.length
      ? list.map((q) => `<button class="topic-row" data-id="${q.id}">
          <div class="t-head"><strong>${q.topic}</strong><span>${q.difficulty}</span></div>
          <div class="r-why" style="margin-top:6px">${q.stem}</div>
        </button>`).join("")
      : `<p class="muted">No bookmarks yet. Flag questions during a quiz to review them later.</p>`;
    document.querySelectorAll("#bookmark-list .topic-row").forEach((b) =>
      b.addEventListener("click", () => {
        const q = QUESTION_BANK.find((x) => x.id === b.dataset.id);
        showQuestionOnly(q);
      }));
  }

  function showQuestionOnly(q) {
    // Lightweight single-question review with answer + explanation revealed.
    quiz = { mode: "review", items: [q], index: 0, answers: { [q.id]: q.answer }, timerId: null, secondsLeft: null };
    $("quiz-mode-label").textContent = "Review";
    renderQuestion();
    const chosen = q.answer;
    revealAnswer(chosen, true);
    document.querySelectorAll(".option").forEach((b) => { b.disabled = true; });
    $("btn-next").textContent = "Back to bookmarks";
    $("btn-next").classList.remove("hidden");
    show("quiz");
  }

  // ---------- wiring ----------
  $("btn-practice").addEventListener("click", () => startQuiz("practice"));
  $("btn-mock").addEventListener("click", () => startQuiz("mock"));
  $("btn-revision").addEventListener("click", () => { renderBookmarks(); show("bookmarks"); });
  $("btn-bookmarks").addEventListener("click", () => { renderBookmarks(); show("bookmarks"); });
  $("btn-bm-home").addEventListener("click", () => { renderHome(); show("home"); });
  $("btn-home").addEventListener("click", () => { renderHome(); show("home"); });
  $("btn-retake").addEventListener("click", () => startQuiz("practice"));

  $("btn-next").addEventListener("click", () => {
    if (quiz && quiz.mode === "review") { renderBookmarks(); show("bookmarks"); quiz = null; return; }
    nextQuestion();
  });

  $("btn-flag").addEventListener("click", () => {
    if (!quiz) return;
    const id = quiz.items[quiz.index].id;
    setBookmark(id, !bookmarks.has(id));
  });

  $("btn-quit").addEventListener("click", () => {
    if (quiz && confirm("End this quiz? Your answers so far will be graded.")) finishQuiz(false);
    else if (quiz) { /* keep going */ }
  });

  // ---------- boot ----------
  updateBookmarkCount();
  renderHome();
  show("home");
})();

</script>
</body>
</html>
