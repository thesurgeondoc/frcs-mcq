<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FRCS MCQ Prep</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">✚</span>
      <div>
        <h1>FRCS MCQ Prep</h1>
        <p class="tagline">Surgical revision, bite-sized</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-bookmarks" class="icon-btn" title="Bookmarked questions" aria-label="Bookmarks">🔖 <span id="bm-count" class="badge">0</span></button>
    </div>
  </header>

  <main id="screen-home" class="screen">
    <section class="card hero">
      <h2>Welcome back</h2>
      <p id="home-summary">You haven't attempted any questions yet.</p>
      <div class="hero-stats" id="home-stats"></div>
    </section>

    <section>
      <h3 class="section-title">Study modes</h3>
      <div class="mode-grid">
        <button class="mode-card" id="btn-practice">
          <span class="mode-icon">📚</span>
          <strong>Practice set</strong>
          <small>10 questions · instant feedback &amp; explanations</small>
        </button>
        <button class="mode-card" id="btn-mock">
          <span class="mode-icon">⏱️</span>
          <strong>Timed mock</strong>
          <small>20 questions · 25-minute exam pace</small>
        </button>
        <button class="mode-card" id="btn-revision">
          <span class="mode-icon">🔖</span>
          <strong>Bookmarks</strong>
          <small>Review only the questions you flagged</small>
        </button>
      </div>
    </section>

    <section>
      <h3 class="section-title">Topics</h3>
      <div id="topic-list" class="topic-list"></div>
    </section>
  </main>

  <main id="screen-quiz" class="screen hidden">
    <div class="quiz-hud">
      <div class="hud-left">
        <span id="quiz-mode-label" class="chip"></span>
        <span id="quiz-topic" class="chip chip-topic"></span>
      </div>
      <div class="hud-right">
        <span id="quiz-progress" class="progress-text">1 / 10</span>
        <button id="btn-quit" class="icon-btn" title="End quiz">✕</button>
      </div>
    </div>

    <div id="timer-wrap" class="timer-wrap hidden">
      <div id="timer-bar" class="timer-bar"></div>
      <div class="timer-text"><span id="timer-clock">--:--</span></div>
    </div>

    <div class="card question-card">
      <div class="q-meta"><span id="q-difficulty"></span><button id="btn-flag" class="flag-btn" title="Bookmark">🔖</button></div>
      <h2 id="q-stem" class="q-stem"></h2>
      <div id="options" class="options"></div>
      <div id="explanation" class="explanation hidden">
        <strong>💡 Explanation</strong>
        <p id="explanation-text"></p>
      </div>
      <div class="q-actions">
        <button id="btn-next" class="primary-btn hidden">Next question →</button>
      </div>
    </div>
  </main>

  <main id="screen-results" class="screen hidden">
    <section class="card score-card">
      <h2 id="result-title">Quiz complete</h2>
      <div class="score-ring" id="score-ring"></div>
      <p id="result-detail" class="muted"></p>
      <div class="result-stats" id="result-stats"></div>
    </section>
    <section class="card">
      <h3 class="section-title">Review answers</h3>
      <div id="review-list" class="review-list"></div>
    </section>
    <div class="q-actions center">
      <button id="btn-retake" class="primary-btn">Retake</button>
      <button id="btn-home" class="ghost-btn">Home</button>
    </div>
  </main>

  <main id="screen-bookmarks" class="screen hidden">
    <h3 class="section-title">Bookmarked questions</h3>
    <div id="bookmark-list" class="topic-list"></div>
    <button id="btn-bm-home" class="ghost-btn">← Back home</button>
  </main>
</div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
