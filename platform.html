<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRCS | Orthopaedic preparation</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#142b49;font:15px system-ui,sans-serif}header{display:flex;align-items:center;gap:12px;padding:18px 5%;background:white;border-bottom:1px solid #dce5ef;flex-wrap:wrap}header strong{font-size:27px;letter-spacing:-1px}small,p{color:#63778d}button,input,select,textarea{font:inherit}button{background:#2869ac;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer}button.alt{background:#eaf1fa;color:#142b49}.grow{flex:1}main{padding:30px;flex:1;min-width:0}.hero{padding:60px 7%;background:linear-gradient(120deg,#e7f1fc,#fff);display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}h1{font-size:clamp(30px,5vw,54px);line-height:1.12;letter-spacing:-1.5px;margin:15px 0}h2{margin-top:0}p{line-height:1.6}.section{padding:30px 7%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{background:white;border:1px solid #dce5ef;border-radius:12px;padding:20px;margin-bottom:12px}.card h3{margin:0 0 10px}.metric{font-size:30px;color:#2869ac;font-weight:700}.shell{display:flex;min-height:80vh}aside{background:#142b49;width:210px;padding:16px;flex-shrink:0}aside button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0}aside button.active{background:#355777}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{padding:11px;width:100%;border:1px solid #ccd9e8;border-radius:7px;color:#142b49}textarea{min-height:90px}.notice{background:#e7f1fc;padding:14px;border-radius:8px;margin:12px 0}.option{display:block;width:100%;text-align:left;margin:9px 0;background:#fff;color:#142b49;border:1px solid #cddaea}.correct{background:#def3e4!important}.wrong{background:#fce4e4!important}.bar{height:8px;border-radius:8px;background:#e7eef6;overflow:hidden;margin:6px 0 15px}.bar i{display:block;height:100%;background:#2869ac}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}footer{background:#142b49;color:white;padding:25px 7%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}@media(max-width:650px){.hero{grid-template-columns:1fr;padding:30px 5%}.shell{display:block}aside{width:100%;display:flex;overflow:auto}aside button{white-space:nowrap;width:auto}main{padding:15px}.grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
